# This file intentionally does NOT define a Secret resource — no credentials
# are committed to this repo.
#
# The Deployment (02-deployment.yaml) references an imagePullSecret named
# `docr-registry-secret` in the `demo` namespace. Create it once, manually,
# with the DigitalOcean Container Registry (DOCR) API token:
#
#   kubectl create secret docker-registry docr-registry-secret \
#     --docker-server=registry.digitalocean.com \
#     --docker-username=<DOCR_API_TOKEN> \
#     --docker-password=<DOCR_API_TOKEN> \
#     --docker-email=<any-valid-email> \
#     -n demo
#
# DOCR uses the same API token for both --docker-username and
# --docker-password. See README.md for the full one-time setup steps.
